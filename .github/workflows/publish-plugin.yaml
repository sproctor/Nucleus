name: Publish Plugin to Maven Central

on:
  push:
    tags:
      - '*'

jobs:
  build-natives:
    uses: ./.github/workflows/build-natives.yaml

  gradle:
    needs: build-natives
    runs-on: ubuntu-latest
    env:
      # Override to publish the plugin under your own namespace. PUBLISH_GROUP sets the
      # Maven group of the main plugin artifact; PUBLISH_PLUGIN_ID sets the plugin id,
      # which is also the groupId of the generated plugin-marker artifact. Both default
      # to the canonical values, so upstream is unaffected. Set them as repository
      # variables to enable a parallel publication under your own verified namespace.
      ORG_GRADLE_PROJECT_GROUP: ${{ vars.PUBLISH_GROUP || 'io.github.kdroidfilter' }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libdbus-1-dev libglib2.0-dev

      - name: Download native artifacts
        uses: ./.github/actions/download-natives

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle Caches
        uses: gradle/actions/setup-gradle@v6

      - name: Run Gradle tasks
        run: ./gradlew preMerge --continue

      - name: Publish plugin to Maven Central
        run: ./gradlew --project-dir plugin-build publishAndReleaseToMavenCentral --no-configuration-cache
        if: success()
        env:
          # ORG_GRADLE_PROJECT_ID is intentionally scoped to the publish step only.
          # The bundled sample apps apply the plugin by its canonical id, so overriding
          # the id during the preMerge build would break their plugin resolution.
          ORG_GRADLE_PROJECT_ID: ${{ vars.PUBLISH_PLUGIN_ID || 'io.github.kdroidfilter.nucleus' }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNINGKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNINGPASSWORD }}
