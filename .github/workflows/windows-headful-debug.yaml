# TEMPORARY — debug branch only, never merged. Runs just the two Windows
# headful jobs (JVM suite, GraalVM native test pyramid) with the same steps as
# pre-merge.yaml / test-graalvm.yaml, to catch where they hang.
name: Windows headful debug (temporary)

on:
  push:
    branches:
      - debug/windows-headful
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  # Does the watcher itself work on Windows? A fake stalled command and a fake
  # stalled JVM, 30 s stall limit: both steps must fail quickly with HANG output.
  watcher-selftest-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Stalled shell command
        id: stalled_shell
        continue-on-error: true
        shell: bash
        env:
          HANG_WATCH_STALL_SECONDS: '30'
          HANG_WATCH_PROGRESS: 'watcher selftest (shell)'
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/run-with-hang-watch.sh 5 build/headful-logs/selftest-shell.log bash -c 'echo "[tao-headful] START fake stalled case"; sleep 600'
      - name: Stalled JVM
        id: stalled_jvm
        continue-on-error: true
        shell: bash
        env:
          HANG_WATCH_STALL_SECONDS: '30'
        run: |
          mkdir -p build/selftest
          printf '%s\n' 'public class TaoHeadfulTestSuiteMain { public static void main(String[] a) throws Exception { System.out.println("[tao-headful] START fake stalled JVM case"); System.out.flush(); Thread.sleep(600000); } }' > build/selftest/TaoHeadfulTestSuiteMain.java
          .github/scripts/run-with-hang-watch.sh 5 build/headful-logs/selftest-jvm.log java build/selftest/TaoHeadfulTestSuiteMain.java
      - name: Both must have failed (hang detected), not passed
        shell: bash
        run: |
          echo "shell: ${{ steps.stalled_shell.outcome }}  jvm: ${{ steps.stalled_jvm.outcome }}"
          test "${{ steps.stalled_shell.outcome }}" = failure
          test "${{ steps.stalled_jvm.outcome }}" = failure

  build-natives:
    uses: ./.github/workflows/build-natives.yaml

  tao-headful-windows:
    needs: [build-natives]
    # Only the Windows natives are needed: run even when another platform's build fails or is never picked up.
    if: always()
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Mesa software OpenGL (Windows)
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          path: C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk\*\x64\bin

      - name: Run headful suite
        shell: bash
        env:
          HANG_WATCH_PROGRESS: 'headful progress (JVM, Windows)'
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/run-with-hang-watch.sh 48 build/headful-logs/tao-headful.log ./gradlew :decorated-window-tao:taoHeadfulTest

      - name: Upload headful log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headful-log-Windows
          path: build/headful-logs/
          if-no-files-found: ignore

  graalvm-windows:
    needs: [build-natives]
    # Only the Windows natives are needed: run even when another platform's build fails or is never picked up.
    if: always()
    timeout-minutes: 90
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - name: Setup Nucleus (GraalVM)
        uses: ./.github/actions/setup-nucleus
        with:
          graalvm: 'true'
          setup-gradle: 'true'

      - name: Build native test runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :examples:tao-native-test:packageGraalvmNative -PnativeMarch=compatibility --no-daemon --stacktrace

      - name: Run native test pyramid
        shell: bash
        env:
          NUCLEUS_TAO_INPUT_INJECTION: '1'
          HANG_WATCH_PROGRESS: 'headful progress (GraalVM, Windows)'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BIN=$(find examples/tao-native-test/build/compose/binaries -type f \( -name 'tao-native-test' -o -name 'tao-native-test.exe' \) | head -1)
          echo "binary: $BIN"
          test -n "$BIN"
          .github/scripts/run-with-hang-watch.sh 45 build/headful-logs/graalvm-native-test.log \
            bash -c '"$0" battery && "$0" headful' "$BIN"

      - name: Upload native test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-native-test-log-Windows
          path: build/headful-logs/
          if-no-files-found: ignore
